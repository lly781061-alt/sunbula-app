<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B2A4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="السنبلة">
<title>محل الكهربائيات والإنشائيات - السنبلة</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-gradient: linear-gradient(135deg, #F26522 0%, #F2B21B 50%, #0B2A4A 100%);
    --main-color: #0B2A4A;
    --accent-color: #F26522;
    --text-color: #1f2937;
    --price-color: #b45309;
    --app-font-family: system-ui, -apple-system, sans-serif;
    --app-font-size: 14px;
    --rent-name-color: #111827;
    --rent-price-color: #0d9488;
    --rent-date-color: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--app-font-family); -webkit-tap-highlight-color: transparent; }
  body { background-color: #F4F6F8; color: var(--text-color); font-size: var(--app-font-size); padding-bottom: 84px; }

  .header { background: var(--primary-gradient); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .header h1 { font-size: calc(var(--app-font-size) + 2px); font-weight: bold; }
  .btn-icon { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .quick-bar { background: white; padding: 10px; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #e5e7eb; }
  .q-btn { flex: 1; border: none; padding: 9px 6px; border-radius: 20px; font-size: calc(var(--app-font-size) - 2px); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .q-debt { background: #dbeafe; color: #1e40af; }
  .q-rent { background: #ccfbf1; color: #115e59; }
  .q-item { background: #d1fae5; color: #065f46; }

  .search-box { padding: 10px 12px; }
  .search-input { width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 14px; font-size: var(--app-font-size); background: white; outline: none; }

  .container { padding: 0 12px; max-width: 600px; margin: 0 auto; }
  .card { background: white; border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
  .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #6b7280; cursor: pointer; gap: 3px; width: 20%; }
  .nav-item.active { color: var(--accent-color); font-weight: bold; }
  .nav-icon { font-size: 18px; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .modal-box { background: white; width: 100%; max-width: 430px; border-radius: 20px; padding: 18px; max-height: 90vh; overflow-y: auto; }
  .modal-compact-box { background: white; width: 100%; max-width: 370px; border-radius: 18px; padding: 14px; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-size: calc(var(--app-font-size) + 2px); font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: calc(var(--app-font-size) - 2px); color: #4b5563; margin-bottom: 4px; font-weight: bold; }
  .form-control { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 12px; font-size: var(--app-font-size); outline: none; background: #fff; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn { border: none; padding: 8px 14px; border-radius: 12px; font-size: calc(var(--app-font-size) - 1px); font-weight: bold; cursor: pointer; }
  .btn-blue { background: #2563eb; color: white; }
  .btn-green { background: #059669; color: white; }
  .btn-red { background: #dc2626; color: white; }
  .btn-gray { background: #e5e7eb; color: #374151; }
  .btn-teal { background: #0d9488; color: white; }

  .sum-box { background: #2563eb; color: white; padding: 16px; border-radius: 18px; margin-bottom: 12px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-radius: 10px; border-bottom: 1px solid #f3f4f6; margin-bottom: 4px; font-size: calc(var(--app-font-size) - 2px); background: #ffffff; }

  /* أزرار الإيجار وإدارة المعدات */
  .rent-actions-bar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .btn-new-rent-main { flex: 1; background: #ccfbf1; color: #115e59; border: 1px solid #99f6e4; border-radius: 14px; padding: 10px 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .btn-manage-eq { background: #2563eb; color: #fff; border: none; border-radius: 14px; padding: 10px 14px; font-weight: 800; font-size: 13px; cursor: pointer; }
  .btn-rent-log { background: #e5e7eb; color: #1f2937; border: none; border-radius: 14px; padding: 10px 12px; font-weight: 800; font-size: 13px; cursor: pointer; }

  /* لوحة إدارة المعدات المخفية افتراضياً */
  .equip-drawer { display: none; background: #ffffff; border: 2px solid #2563eb; border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .equip-drawer.open { display: block; }
  .equip-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap; }
  .equip-row:last-child { border-bottom: none; }

  /* بطاقة قيد الإيجار النشط والمجموع التراكمي */
  .active-rental-card { border-right: 4px solid #0d9488; }
  .rental-total-badge { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 5px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; display: inline-block; }
  .receive-summary-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; font-size: 12.5px; line-height: 1.7; margin-bottom: 10px; }
  .receive-total-box { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; border-radius: 10px; padding: 8px 10px; font-weight: 800; font-size: 13px; text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>

  <div class="header">
    <h1 id="storeTitle">محل الكهربائيات والإنشائيات - السنبلة</h1>
    <button class="btn-icon" onclick="switchTab('reports')">⚙️</button>
  </div>

  <div class="quick-bar">
    <button class="q-btn q-debt" onclick="openDebtModal()">➕ دين جديد</button>
    <button class="q-btn q-rent" onclick="openRentModal()">🛠️ إيجار جديد</button>
    <button class="q-btn q-item" onclick="openItemModal()">📦 إضافة صنف</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchBox" class="search-input" placeholder="🔍 بحث عام شامل في المخزن، الديون، الإيجار..." oninput="render()">
  </div>

  <div class="container" id="mainContent"></div>

  <div class="bottom-nav">
    <button class="nav-item" id="nav-pos" onclick="switchTab('pos')"><span class="nav-icon">🧾</span><span>البيع</span></button>
    <button class="nav-item" id="nav-store" onclick="switchTab('store')"><span class="nav-icon">📦</span><span>المخزن</span></button>
    <button class="nav-item" id="nav-debts" onclick="switchTab('debts')"><span class="nav-icon">📒</span><span>الديون</span></button>
    <button class="nav-item active" id="nav-rents" onclick="switchTab('rents')"><span class="nav-icon">🛠️</span><span>الإيجار</span></button>
    <button class="nav-item" id="nav-reports" onclick="switchTab('reports')"><span class="nav-icon">📊</span><span>الإعدادات</span></button>
  </div>

  <!-- نافذة إضافة صنف -->
  <div class="modal" id="itemModal">
    <div class="modal-box">
      <div class="modal-title"><span>إضافة صنف جديد</span><button class="btn btn-gray" style="padding:4px 8px;font-size:11px;" onclick="closeModal('itemModal')">إغلاق</button></div>
      <div class="form-group"><label>اسم الصنف</label><input type="text" id="iName" class="form-control" placeholder="مثل: مصباح"></div>
      <div class="form-group"><label>السعر (د.ع)</label><input type="number" id="iPrice" class="form-control" placeholder="5000"></div>
      <div class="form-group"><label>الكمية المتوفرة</label><input type="number" id="iQty" class="form-control" value="10"></div>
      <div class="modal-actions">
        <button class="btn btn-gray" onclick="closeModal('itemModal')">إلغاء</button>
        <button class="btn btn-green" onclick="saveItem()">حفظ</button>
      </div>
    </div>
  </div>

  <!-- نافذة تسجيل دين جديد -->
  <div class="modal" id="debtModal">
    <div class="modal-box">
      <div class="modal-title"><span>تسجيل دين جديد</span><button class="btn btn-gray" style="padding:4px 8px;font-size:11px;" onclick="closeModal('debtModal')">إغلاق</button></div>
      <div class="form-group"><label>اسم العميل</label><input type="text" id="dName" class="form-control" placeholder="اسم الزبون"></div>
      <div class="form-group"><label>المبلغ (د.ع)</label><input type="number" id="dAmount" class="form-control" placeholder="0"></div>
      <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="dPhone" class="form-control" placeholder="077..."></div>
      <div class="form-group"><label>ملاحظات</label><textarea id="dNote" class="form-control" rows="2" placeholder="تفاصيل..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-gray" onclick="closeModal('debtModal')">إلغاء</button>
        <button class="btn btn-blue" onclick="saveDebt()">حفظ الدين</button>
      </div>
    </div>
  </div>

  <!-- نافذة تسجيل / تعديل إيجار -->
  <div class="modal" id="rentModal">
    <div class="modal-box">
      <div class="modal-title"><span id="rentModalTitle">تسجيل إيجار جديد</span><button class="btn btn-gray" style="padding:4px 8px;font-size:11px;" onclick="closeModal('rentModal')">إغلاق</button></div>
      <input type="hidden" id="rEditId">
      <div class="form-group"><label>اسم المستأجر</label><input type="text" id="rTenant" class="form-control" placeholder="مثال: كرار عدنان"></div>
      <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="rPhone" class="form-control" placeholder="لا يوجد"></div>
      <div class="form-group">
        <label>المعدة</label>
        <select id="rEquipSelect" class="form-control" onchange="onRentEquipChange()"></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="form-group"><label>العدد</label><input type="number" id="rQty" class="form-control" min="1" value="1"></div>
        <div class="form-group"><label>سعر الإيجار (د.ع/يوم)</label><input type="number" id="rDailyRate" class="form-control" min="0" value="0"></div>
      </div>
      <div class="form-group"><label>تاريخ البدء</label><input type="date" id="rStartDate" class="form-control"></div>
      <div class="form-group"><label>ملاحظات</label><input type="text" id="rNotes" class="form-control" placeholder="ملاحظات..."></div>
      <div class="modal-actions">
        <button class="btn btn-gray" onclick="closeModal('rentModal')">إلغاء</button>
        <button class="btn btn-teal" onclick="saveRent()">حفظ الإيجار</button>
      </div>
    </div>
  </div>

  <!-- نافذة تفاصيل الاستلام المصغّرة -->
  <div class="modal" id="receiveModal">
    <div class="modal-compact-box">
      <div class="modal-title" style="margin-bottom:8px;">
        <span>📋 تفاصيل الاستلام (ملخص)</span>
        <button class="btn btn-gray" style="padding:3px 8px;font-size:11px;" onclick="closeModal('receiveModal')">✕</button>
      </div>
      <div id="receiveSummaryBox" class="receive-summary-box"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="form-group" style="margin-bottom:8px;">
          <label>عدد الأيام</label>
          <input type="number" id="recDays" class="form-control" style="padding:7px;" min="1" value="1" oninput="updateReceiveCalc()">
        </div>
        <div class="form-group" style="margin-bottom:8px;">
          <label>سعر اليوم (د.ع)</label>
          <input type="number" id="recRate" class="form-control" style="padding:7px;" min="0" oninput="updateReceiveCalc()">
        </div>
      </div>
      <div id="recTotalBox" class="receive-total-box">المجموع: 0 د.ع</div>
      <div class="modal-actions" style="margin-top:6px;">
        <button type="button" class="btn btn-green" style="flex:1;" onclick="confirmReceiveRent()">تأكيد الاستلام</button>
        <button type="button" class="btn btn-gray" onclick="closeModal('receiveModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة سجل الإيجارات المنتهية -->
  <div class="modal" id="rentHistoryModal">
    <div class="modal-compact-box">
      <div class="modal-title">
        <span>📜 سجل الإيجارات المنتهية</span>
        <button class="btn btn-gray" style="padding:3px 8px;font-size:11px;" onclick="closeModal('rentHistoryModal')">✕</button>
      </div>
      <div id="rentHistoryList"></div>
    </div>
  </div>

<script>
  const DB_KEY = "sunbula_app_data_v3";
  let currentTab = "rents";
  let equipmentPanelOpen = false;
  let activeReceiveId = null;

  const defaultEquipments = [
    { id: 1, name: "قفص سكلة", total: 40, assetPrice: 0, dailyRate: 1.5 },
    { id: 2, name: "دراب 4 متر", total: 20, assetPrice: 0, dailyRate: 1 },
    { id: 3, name: "دريل همر تكسير / تكشير", total: 12, assetPrice: 0, dailyRate: 10 },
    { id: 4, name: "كسار كبير", total: 8, assetPrice: 0, dailyRate: 20 }
  ];

  const defaultRents = [
    {
      id: 101,
      tenant: "كرار عدنان",
      phone: "لا يوجد",
      eqId: 1,
      eqName: "قفص سكلة",
      qty: 10,
      assetPrice: 0,
      dailyRate: 1.5,
      startDate: "2026-11-17",
      notes: "",
      status: "active"
    },
    {
      id: 102,
      tenant: "محمد صادق",
      phone: "لا يوجد",
      eqId: 2,
      eqName: "دراب 4 متر",
      qty: 2,
      assetPrice: 0,
      dailyRate: 1,
      startDate: "2026-11-21",
      notes: "",
      status: "active"
    }
  ];

  let state = JSON.parse(localStorage.getItem(DB_KEY)) || {
    items: [
      { id: 1, name: "مصباح LED 20W", price: 3500, qty: 25 },
      { id: 2, name: "كيبل 2x4mm الفنار", price: 65000, qty: 12 }
    ],
    debts: [],
    equipments: defaultEquipments,
    rents: defaultRents
  };

  if (!Array.isArray(state.equipments) || !state.equipments.length) state.equipments = [...defaultEquipments];
  if (!Array.isArray(state.rents)) state.rents = [...defaultRents];

  function saveState() {
    localStorage.setItem(DB_KEY, JSON.stringify(state));
  }

  function fmtIQD(n) {
    const num = Number(n || 0);
    return num.toLocaleString("en-US", { maximumFractionDigits: 2 }).replace(/,/g, ".") + " د.ع";
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  // حساب عدد الأيام من تاريخ البدء حتى اليوم (أو تاريخ الانتهاء)
  function calcDaysElapsed(startDateStr, endDateStr = null) {
    if (!startDateStr) return 1;
    const start = new Date(startDateStr + "T00:00:00");
    const end = endDateStr
      ? new Date(endDateStr + "T00:00:00")
      : new Date(todayISO() + "T00:00:00");
    if (isNaN(start.getTime()) || isNaN(end.getTime())) return 1;
    const diffDays = Math.floor((end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24)) + 1;
    return Math.max(1, diffDays);
  }

  // حساب إيجار اليوم الواحد والمجموع التراكمي للأيام
  function calcRentalTotals(r) {
    const days = calcDaysElapsed(r.startDate, r.endDate || null);
    const qty = Math.max(1, Number(r.qty || 1));
    const ratePerUnit = Math.max(0, Number(r.dailyRate || 0));
    const dailyTotal = ratePerUnit * qty;
    const accumulatedTotal = dailyTotal * days;
    return { days, dailyTotal, accumulatedTotal };
  }

  function getAvailableEqQty(eq) {
    const rented = state.rents
      .filter((r) => r.status === "active" && r.eqId === eq.id)
      .reduce((sum, r) => sum + Number(r.qty || 0), 0);
    return Math.max(0, Number(eq.total || 0) - rented);
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".nav-item").forEach((el) => el.classList.remove("active"));
    const navEl = document.getElementById("nav-" + tab);
    if (navEl) navEl.classList.add("active");
    render();
  }

  function openModal(id) {
    document.getElementById(id).classList.add("open");
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove("open");
  }

  function toggleEquipmentPanel() {
    equipmentPanelOpen = !equipmentPanelOpen;
    render();
  }

  function addEquipment() {
    const name = document.getElementById("newEqName").value.trim();
    const total = Math.max(0, parseInt(document.getElementById("newEqTotal").value, 10) || 0);
    const assetPrice = Math.max(0, parseFloat(document.getElementById("newEqAssetPrice").value) || 0);
    const dailyRate = Math.max(0, parseFloat(document.getElementById("newEqDailyRate").value) || 0);
    if (!name) return;

    state.equipments.push({ id: Date.now(), name, total, assetPrice, dailyRate });
    saveState();
    render();
  }

  function updateEqRate(eqId, val) {
    const eq = state.equipments.find((e) => e.id === eqId);
    if (!eq) return;
    eq.dailyRate = Math.max(0, parseFloat(val) || 0);
    saveState();
    render();
  }

  function deleteEquipment(eqId) {
    state.equipments = state.equipments.filter((e) => e.id !== eqId);
    saveState();
    render();
  }

  function fillEquipSelect(selectedId = null) {
    const sel = document.getElementById("rEquipSelect");
    sel.innerHTML = state.equipments
      .map((eq) => `<option value="${eq.id}">${eq.name} (${fmtIQD(eq.dailyRate)}/يوم)</option>`)
      .join("");
    if (selectedId) sel.value = selectedId;
  }

  function onRentEquipChange() {
    const eqId = parseInt(document.getElementById("rEquipSelect").value, 10);
    const eq = state.equipments.find((e) => e.id === eqId);
    if (eq) document.getElementById("rDailyRate").value = eq.dailyRate;
  }

  function openRentModal(editId = null) {
    fillEquipSelect();
    if (editId) {
      const r = state.rents.find((x) => x.id === editId);
      if (!r) return;
      document.getElementById("rentModalTitle").textContent = "تعديل قيد الإيجار";
      document.getElementById("rEditId").value = r.id;
      document.getElementById("rTenant").value = r.tenant;
      document.getElementById("rPhone").value = r.phone || "لا يوجد";
      fillEquipSelect(r.eqId);
      document.getElementById("rQty").value = r.qty;
      document.getElementById("rDailyRate").value = r.dailyRate;
      document.getElementById("rStartDate").value = r.startDate || todayISO();
      document.getElementById("rNotes").value = r.notes || "";
    } else {
      document.getElementById("rentModalTitle").textContent = "تسجيل إيجار جديد";
      document.getElementById("rEditId").value = "";
      document.getElementById("rTenant").value = "";
      document.getElementById("rPhone").value = "لا يوجد";
      onRentEquipChange();
      document.getElementById("rQty").value = 1;
      document.getElementById("rStartDate").value = todayISO();
      document.getElementById("rNotes").value = "";
    }
    openModal("rentModal");
  }

  function saveRent() {
    const editId = document.getElementById("rEditId").value;
    const tenant = document.getElementById("rTenant").value.trim();
    const phone = document.getElementById("rPhone").value.trim() || "لا يوجد";
    const eqId = parseInt(document.getElementById("rEquipSelect").value, 10);
    const eq = state.equipments.find((e) => e.id === eqId);
    const qty = Math.max(1, parseInt(document.getElementById("rQty").value, 10) || 1);
    const dailyRate = Math.max(0, parseFloat(document.getElementById("rDailyRate").value) || 0);
    const startDate = document.getElementById("rStartDate").value || todayISO();
    const notes = document.getElementById("rNotes").value.trim();
    if (!tenant) return;

    if (editId) {
      const r = state.rents.find((x) => String(x.id) === String(editId));
      if (r) {
        r.tenant = tenant;
        r.phone = phone;
        r.eqId = eqId;
        r.eqName = eq ? eq.name : r.eqName;
        r.assetPrice = eq ? eq.assetPrice : (r.assetPrice || 0);
        r.qty = qty;
        r.dailyRate = dailyRate;
        r.startDate = startDate;
        r.notes = notes;
      }
    } else {
      state.rents.unshift({
        id: Date.now(),
        tenant,
        phone,
        eqId,
        eqName: eq ? eq.name : "معدة",
        assetPrice: eq ? eq.assetPrice : 0,
        qty,
        dailyRate,
        startDate,
        notes,
        status: "active"
      });
    }

    saveState();
    closeModal("rentModal");
    render();
  }

  function deleteRent(id) {
    state.rents = state.rents.filter((r) => r.id !== id);
    saveState();
    render();
  }

  function openReceiveModal(id) {
    const r = state.rents.find((x) => x.id === id);
    if (!r) return;
    activeReceiveId = id;
    const { days, dailyTotal } = calcRentalTotals(r);

    document.getElementById("recDays").value = days;
    document.getElementById("recRate").value = dailyTotal;
    document.getElementById("receiveSummaryBox").innerHTML = `
      <div><strong>المستأجر:</strong> ${r.tenant} (${r.phone || "لا يوجد"})</div>
      <div><strong>المعدة والعدد:</strong> ${r.eqName} × ${r.qty}</div>
      <div><strong>البدء:</strong> ${r.startDate || todayISO()}</div>
    `;
    updateReceiveCalc();
    openModal("receiveModal");
  }

  function updateReceiveCalc() {
    const days = Math.max(1, parseInt(document.getElementById("recDays").value, 10) || 1);
    const dailyTotal = Math.max(0, parseFloat(document.getElementById("recRate").value) || 0);
    document.getElementById("recTotalBox").textContent = `المجموع (${days} يوم): ${fmtIQD(days * dailyTotal)}`;
  }

  function confirmReceiveRent() {
    const r = state.rents.find((x) => x.id === activeReceiveId);
    if (!r) return;
    const days = Math.max(1, parseInt(document.getElementById("recDays").value, 10) || 1);
    const dailyTotal = Math.max(0, parseFloat(document.getElementById("recRate").value) || 0);

    r.status = "completed";
    r.days = days;
    r.totalAmount = days * dailyTotal;
    r.endDate = todayISO();

    saveState();
    closeModal("receiveModal");
    render();
  }

  function openRentHistoryModal() {
    const done = state.rents.filter((r) => r.status === "completed");
    const box = document.getElementById("rentHistoryList");
    if (!done.length) {
      box.innerHTML = `<div style="text-align:center;color:#6b7280;padding:12px;font-size:12px;">لا توجد إيجارات منتهية.</div>`;
    } else {
      box.innerHTML = done
        .map(
          (r) => `
          <div class="history-item">
            <div>
              <strong>${r.tenant}</strong><br>
              <small style="color:#6b7280;">${r.eqName} × ${r.qty} (${r.days || 1} يوم) — ${r.endDate || ""}</small>
            </div>
            <strong style="color:#059669;">${fmtIQD(r.totalAmount || 0)}</strong>
          </div>
        `
        )
        .join("");
    }
    openModal("rentHistoryModal");
  }

  function openItemModal() {
    document.getElementById("iName").value = "";
    document.getElementById("iPrice").value = "";
    document.getElementById("iQty").value = 10;
    openModal("itemModal");
  }

  function saveItem() {
    const name = document.getElementById("iName").value.trim();
    const price = parseFloat(document.getElementById("iPrice").value) || 0;
    const qty = parseInt(document.getElementById("iQty").value, 10) || 0;
    if (!name) return;
    state.items.push({ id: Date.now(), name, price, qty });
    saveState();
    closeModal("itemModal");
    render();
  }

  function openDebtModal() {
    document.getElementById("dName").value = "";
    document.getElementById("dAmount").value = "";
    document.getElementById("dPhone").value = "";
    document.getElementById("dNote").value = "";
    openModal("debtModal");
  }

  function saveDebt() {
    const name = document.getElementById("dName").value.trim();
    const amount = parseFloat(document.getElementById("dAmount").value) || 0;
    const phone = document.getElementById("dPhone").value.trim();
    const note = document.getElementById("dNote").value.trim();
    if (!name) return;
    state.debts.push({ id: Date.now(), name, amount, phone, note, date: todayISO() });
    saveState();
    closeModal("debtModal");
    render();
  }

  function renderRentsTab(q) {
    const activeRents = state.rents.filter((r) => {
      if (r.status !== "active") return false;
      if (!q) return true;
      return (
        (r.tenant || "").toLowerCase().includes(q) ||
        (r.eqName || "").toLowerCase().includes(q) ||
        (r.notes || "").toLowerCase().includes(q)
      );
    });

    const equipRowsHtml = state.equipments
      .map(
        (eq) => `
        <div class="equip-row">
          <div>
            <strong style="font-size:14px;">${eq.name}</strong>
            <div style="font-size:12px;color:#6b7280;margin-top:2px;">
              متاح ${getAvailableEqQty(eq)} من ${eq.total} | سعر المعدة: ${fmtIQD(eq.assetPrice || 0)} | الإيجار: ${fmtIQD(eq.dailyRate)} / يوم
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="number" step="any" class="form-control" style="width:92px;padding:6px 8px;font-size:13px;" value="${eq.dailyRate}" onchange="updateEqRate(${eq.id}, this.value)">
            <button type="button" class="btn btn-red" style="padding:6px 12px;font-size:12px;" onclick="deleteEquipment(${eq.id})">حذف</button>
          </div>
        </div>
      `
      )
      .join("");

    const activeCardsHtml = activeRents.length
      ? activeRents
          .map((r) => {
            const { days, dailyTotal, accumulatedTotal } = calcRentalTotals(r);
            return `
              <div class="card active-rental-card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                  <div>
                    <div style="font-size:17px;font-weight:800;color:var(--rent-name-color);">${r.tenant}</div>
                    <div style="font-size:13px;color:#374151;margin-top:4px;">المعدات: <strong>${r.eqName} × ${r.qty}</strong></div>
                    <div style="font-size:12px;color:var(--rent-date-color);margin-top:3px;">
                      البدء: ${r.startDate || ""} (${days} ${days === 1 ? "يوم" : "أيام"}) | سعر المعدة: ${fmtIQD(r.assetPrice || 0)}
                    </div>
                    <div style="font-size:13px;font-weight:800;color:var(--rent-price-color);margin-top:5px;">
                      الإيجار: ${fmtIQD(dailyTotal)}/يوم
                    </div>
                  </div>
                  <div style="text-align:left;">
                    <div class="rental-total-badge">المجموع: ${fmtIQD(accumulatedTotal)}</div>
                    <div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end;">
                      <button type="button" class="btn btn-red" style="padding:6px 12px;font-size:12px;" onclick="openReceiveModal(${r.id})">استلام</button>
                      <button type="button" class="btn btn-gray" style="padding:6px 8px;font-size:11px;" onclick="openRentModal(${r.id})">تعديل</button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          })
          .join("")
      : `<div class="card" style="text-align:center;color:#6b7280;">لا توجد قيود إيجار نشطة حالياً.</div>`;

    return `
      <div class="rent-actions-bar">
        <button type="button" class="btn-new-rent-main" onclick="openRentModal()">🛠️ إيجار جديد</button>
        <button type="button" class="btn-manage-eq" onclick="toggleEquipmentPanel()">⚙️ إدارة المعدات</button>
        <button type="button" class="btn-rent-log" onclick="openRentHistoryModal()">📜 سجل</button>
      </div>

      <div class="equip-drawer ${equipmentPanelOpen ? "open" : ""}" id="equipmentDrawer">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <strong style="color:#1d4ed8;font-size:14px;">إدارة المعدات (إضافة / تعديل سعر / حذف)</strong>
          <button type="button" class="btn btn-gray" style="padding:4px 10px;font-size:11px;" onclick="toggleEquipmentPanel()">إخفاء</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <input type="text" id="newEqName" class="form-control" style="padding:8px;font-size:12px;" placeholder="اسم المعدة (مثلاً: قفص سكلة)">
          <input type="number" id="newEqTotal" class="form-control" style="padding:8px;font-size:12px;" placeholder="العدد الكلي">
          <input type="number" step="any" id="newEqAssetPrice" class="form-control" style="padding:8px;font-size:12px;" placeholder="سعر المعدة (د.ع)">
          <input type="number" step="any" id="newEqDailyRate" class="form-control" style="padding:8px;font-size:12px;" placeholder="إيجار / يوم (د.ع)">
        </div>
        <button type="button" class="btn btn-green" style="width:100%;margin-bottom:10px;" onclick="addEquipment()">+ إضافة معدة</button>
        <div>${equipRowsHtml}</div>
      </div>

      <div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
        <strong style="font-size:15px;">قيد الإيجار النشط</strong>
        <span style="background:#ccfbf1;color:#115e59;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:bold;">${activeRents.length}</span>
      </div>
      ${activeCardsHtml}
    `;
  }

  function render() {
    const q = (document.getElementById("searchBox").value || "").trim().toLowerCase();
    const main = document.getElementById("mainContent");

    if (currentTab === "rents") {
      main.innerHTML = renderRentsTab(q);
      return;
    }

    if (currentTab === "debts") {
      const totalDebts = state.debts.reduce((s, d) => s + Number(d.amount || 0), 0);
      const list = state.debts.filter((d) => !q || (d.name || "").toLowerCase().includes(q));
      main.innerHTML = `
        <div class="sum-box">
          <div style="font-size:12px;opacity:0.9;">إجمالي الديون الكلية</div>
          <div style="font-size:20px;font-weight:800;margin-top:4px;">${fmtIQD(totalDebts)}</div>
        </div>
        ${list.length ? list.map((d) => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;">
              <strong>${d.name}</strong>
              <strong style="color:#1e40af;">${fmtIQD(d.amount)}</strong>
            </div>
            <div style="font-size:12px;color:#6b7280;margin-top:4px;">${d.date || ""} ${d.note ? "— " + d.note : ""}</div>
          </div>
        `).join("") : `<div class="card" style="text-align:center;color:#6b7280;">لا توجد ديون مسجلة.</div>`}
      `;
      return;
    }

    if (currentTab === "store") {
      const items = state.items.filter((it) => !q || (it.name || "").toLowerCase().includes(q));
      main.innerHTML = items.length ? items.map((it) => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;">
            <strong>${it.name}</strong>
            <strong style="color:var(--price-color);">${fmtIQD(it.price)}</strong>
          </div>
          <div style="font-size:12px;color:#6b7280;margin-top:4px;">الكمية المتوفرة: ${it.qty}</div>
        </div>
      `).join("") : `<div class="card" style="text-align:center;color:#6b7280;">لا توجد أصناف في المخزن.</div>`;
      return;
    }

    if (currentTab === "reports") {
      main.innerHTML = `
        <div class="card">
          <strong style="display:block;margin-bottom:8px;">إعدادات السنبلة</strong>
          <div style="font-size:12px;color:#4b5563;line-height:1.7;">
            • عدد الأصناف في المخزن: ${state.items.length}<br>
            • عدد قيود الإيجار المسجلة: ${state.rents.length}<br>
            • عدد سجلات الديون: ${state.debts.length}
          </div>
        </div>
      `;
      return;
    }

    const items = state.items.filter((it) => !q || (it.name || "").toLowerCase().includes(q));
    main.innerHTML = `
      <div class="card">
        <strong style="display:block;margin-bottom:8px;">نقطة البيع السريعة</strong>
        ${items.length ? items.map((it) => `
          <div class="history-item">
            <div>
              <strong>${it.name}</strong><br>
              <small style="color:#6b7280;">متوفر: ${it.qty}</small>
            </div>
            <strong style="color:var(--price-color);">${fmtIQD(it.price)}</strong>
          </div>
        `).join("") : `<div style="color:#6b7280;font-size:12px;">لا توجد أصناف مطابقة.</div>`}
      </div>
    `;
  }

  render();
</script>
</body>
</html>
